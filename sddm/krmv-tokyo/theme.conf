[General]
# Wallpaper file inside this theme folder. install.sh fills this in from  ~/.config/hypr/wallpapers/sddm
# A picture (jpg, png, webp), an animated picture (gif) or a silent video (mp4, webm, mkv, mov) all work.
# Video needs:  sudo pacman -S qt6-multimedia qt6-multimedia-ffmpeg
background=
# 0 = the wallpaper as it is, 1 = black. Everything stays readable around 0.4.
dim=0.42
# the accent color (cursor line, arrow, avatar frame)
accent=#0db9d7
