# ~/.config/hypr/hyprlock.conf (linked to theme/hyprlock/hyprlock.conf) - Tokyo Night, square corners
general {
    hide_cursor = true
    ignore_empty_input = true
}

# The current screen, blurred and darkened
background {
    monitor =
    path = screenshot
    color = rgba(1a1b26ff)
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(0db9d7ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(a9b1d6ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

# User name
label {
    monitor =
    text = $USER
    color = rgba(0db9d7ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 360, 48
    rounding = 0
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(444b6aff)
    inner_color = rgba(1a1b26ff)
    font_color = rgba(c0caf5ff)
    check_color = rgba(0db9d7ff)
    fail_color = rgba(f7768eff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##787c99">Password</span>
    fail_text = Wrong password
    position = 0, -50
    halign = center
    valign = center
}
