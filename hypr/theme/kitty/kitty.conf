# ~/.config/hypr/theme/kitty/kitty.conf - written from scratch, Tokyo Night
font_family      JetBrainsMono Nerd Font
font_size        11.5
disable_ligatures never

# Window: never start fullscreen/maximized
start_as                normal
remember_window_size    no
initial_window_width    110c
initial_window_height   32c
hide_window_decorations yes
window_padding_width    10
confirm_os_window_close 0
background_opacity      0.95

# Cursor / bell / scrolling
cursor_shape            beam
cursor_blink_interval   0
enable_audio_bell       no
scrollback_lines        10000
copy_on_select          clipboard
mouse_hide_wait         3.0
url_style               curly
shell_integration       enabled

# Tab
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     angled
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #292e42
tab_bar_background      #16161e

# Tokyo Night colors
foreground              #a9b1d6
background              #1a1b26
selection_foreground    #a9b1d6
selection_background    #33467c
cursor                  #c0caf5
cursor_text_color       #1a1b26
url_color               #73daca
active_border_color     #7aa2f7
inactive_border_color   #444b6a
bell_border_color       #e0af68

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Key bindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
