# ~/.config/hypr/hypridle.conf
general {
    lock_cmd = pidof hyprlock || hyprlock      # what "loginctl lock-session" runs
    before_sleep_cmd = loginctl lock-session   # lock BEFORE suspend: closing the laptop lid suspends, so it locks too
}

# Optional: lock after 10 minutes of inactivity (remove the leading # on the 4 lines below)
